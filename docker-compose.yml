services:
  stylus-backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 8001
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    ports:
      - "${BACKEND_PORT:-8001}:8001"
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./logs:/app/logs
      - ./data:/app/data:ro
    networks:
      stylus-dev-net:
        aliases:
          - stylus-backend
    restart: unless-stopped

networks:
  stylus-dev-net:
    external: true
    name: stylus-dev-net
