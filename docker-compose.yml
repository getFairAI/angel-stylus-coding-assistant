services:
  # Standalone Chroma vector store. Both the API and the ingestion scheduler
  # connect to this one server, so ingestion's writes are immediately visible to
  # the live API (no restart / no per-process cache staleness).
  chroma:
    image: chromadb/chroma:${CHROMA_IMAGE_TAG:-1.5.9}
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /data
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma-data:/data
    ports:
      - "${CHROMA_PORT:-8000}:8000"
    # No in-container healthcheck: the Rust-based chroma image has no python/curl
    # to run one. Dependents wait for start and then poll heartbeat themselves
    # (the API retries per request; the ingestion scheduler waits before its run).
    networks:
      stylus-dev-net:
        aliases:
          - chroma
    restart: unless-stopped

  # NOTE: ollama runs on the host, not in compose. Point OLLAMA_HOST at it. On
  # Linux, host.docker.internal is provided via extra_hosts below; ensure ollama
  # listens on all interfaces (OLLAMA_HOST=0.0.0.0:11434 in its service) and the
  # embedding model is pulled: `ollama pull mxbai-embed-large`.

  stylus-backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 8001
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-mxbai-embed-large}
      CHROMA_SERVER_HOST: ${CHROMA_SERVER_HOST:-chroma}
      # chroma's INTERNAL container port is always 8000. CHROMA_PORT only changes
      # the host-published port, not what other containers connect to — do not
      # set this to the published port.
      CHROMA_SERVER_PORT: "8000"
      CHROMA_MAX_DISTANCE: ${CHROMA_MAX_DISTANCE:-0.6}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      chroma:
        condition: service_started
    ports:
      - "${BACKEND_PORT:-8001}:8001"
    volumes:
      - ./logs:/app/logs
    networks:
      stylus-dev-net:
        aliases:
          - stylus-backend
    restart: unless-stopped

  # Scheduled ingestion — replaces the systemd timer/cron. Runs the pipeline on
  # start (configurable) and then every INGEST_INTERVAL_SECONDS. Shares the same
  # image as the backend.
  ingestion:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "src/ingestion_scheduler.py"]
    # This service runs the scheduler, not the API, so the image's /health
    # HEALTHCHECK does not apply — disable it (otherwise it reports unhealthy).
    healthcheck:
      disable: true
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-mxbai-embed-large}
      CHROMA_SERVER_HOST: ${CHROMA_SERVER_HOST:-chroma}
      # chroma's INTERNAL container port is always 8000. CHROMA_PORT only changes
      # the host-published port, not what other containers connect to — do not
      # set this to the published port.
      CHROMA_SERVER_PORT: "8000"
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      INGEST_INTERVAL_SECONDS: ${INGEST_INTERVAL_SECONDS:-86400}
      RUN_ON_START: ${RUN_ON_START:-true}
      INGEST_FORCE_REFRESH: ${INGEST_FORCE_REFRESH:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      chroma:
        condition: service_started
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      stylus-dev-net:
        aliases:
          - ingestion
    restart: unless-stopped

volumes:
  chroma-data:

networks:
  stylus-dev-net:
    external: true
    name: stylus-dev-net
