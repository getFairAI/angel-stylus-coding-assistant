interface:
  display_name: "Sift Stylus Porting Auditor"
  short_description: "Audit Solidity candidates for Stylus porting upside"
  default_prompt: "Use $sift-stylus-porting-auditor to evaluate Solidity contracts for hybrid Solidity+Stylus migration. Call the skill search tool before final answers when evidence is needed. When tool output includes codebase_analysis, prioritize analysis_action_paths, analysis_brief, high_targets, low_targets, and driver_totals to produce an upside-first recommendation with high_stylus_benefit vs low_stylus_impact classifications, directional percentage estimates, explicit risks, and references. Always open with potential value (benefit signals, likely gains, carveout opportunities), then present caveats as mitigations rather than as the lead narrative. If llm_augmentation_contract is present, follow it as a bounded second pass: keep static ranking as base, only add schema-valid citation-backed augmentations, and fall back to static-only when uncertain. Calibrate wording to the response quality_signals: when confidence=low or found=false, present estimates as directional and flag thin evidence; prefer sources with higher official_count/canonical_count in evidence_profile."
